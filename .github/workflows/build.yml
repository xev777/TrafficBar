name: Build

# Compila TrafficBar en los servidores de GitHub (no en un PC personal): así cada binario se puede verificar contra este
# repositorio (ver la attestation de procedencia más abajo).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write       # attestation de procedencia (firma sigstore de GitHub)
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python pruebas_funciones.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python pruebas_seguridad.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build (PyInstaller + installer + portable zip)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\compilar.ps1

      # SBOM (lista de componentes, CycloneDX): qué librerías de terceros lleva cada versión
      - name: SBOM (CycloneDX)
        shell: powershell
        run: |
          python -m pip install "cyclonedx-bom==4.6.1"
          cyclonedx-py requirements requirements.txt --of JSON -o Output/TrafficBar-sbom.cdx.json
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Hashes
        shell: powershell
        run: Get-FileHash Output\*.exe, Output\*.zip -Algorithm SHA256 | Format-Table Hash, @{n="File";e={Split-Path $_.Path -Leaf}} -AutoSize

      - name: Upload build artifacts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trafficbar-windows
          path: |
            Output/*.exe
            Output/*.zip
            Output/*.cdx.json
          if-no-files-found: error

      # Procedencia verificable: cualquiera puede comprobar que un archivo salió de este repositorio con
      #   gh attestation verify <archivo> --repo xev777/TrafficBar
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            Output/*.exe
            Output/*.zip
            Output/*.cdx.json
