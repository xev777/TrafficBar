name: Build

# Compila TrafficBar en los servidores de GitHub (no en un PC personal): así cada binario se puede verificar contra este
# repositorio (ver la attestation de procedencia más abajo).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write       # attestation de procedencia (firma sigstore de GitHub)
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build (PyInstaller + installer + portable zip)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\compilar.ps1

      - name: Hashes
        shell: powershell
        run: Get-FileHash Output\*.exe, Output\*.zip -Algorithm SHA256 | Format-Table Hash, @{n="File";e={Split-Path $_.Path -Leaf}} -AutoSize

      - name: Upload build artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: trafficbar-windows
          path: |
            Output/*.exe
            Output/*.zip
          if-no-files-found: error

      # Procedencia verificable: cualquiera puede comprobar que un archivo salió de este repositorio con
      #   gh attestation verify <archivo> --repo xev777/TrafficBar
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            Output/*.exe
            Output/*.zip
